<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Daint application icon.
    Copyright (C) 2026  eagre.dev — released under GPL-3.0-or-later with the app.

    A sweeping multicolour brushstroke on a soft rounded tile. Drawn flat so it
    stays crisp from 512px down to 16px. The stroke is a filled ribbon (not a
    stroked path) so it can taper naturally from a rounded brush-head on the
    right to a thin lifted tail on the left, with a few paint dabs at the tail so
    it reads as wet paint rather than a plain swoosh.

    NOTE: this comment lives *inside* <svg>, not between <?xml?> and <svg>. A
    comment in that gap defeats gdk-pixbuf's SVG format sniffer (used by
    appstreamcli during the Flatpak build), causing an icon-file-read-error even
    though the file is valid and rsvg renders it fine. Keep it here.
  -->

  <defs>
    <!-- Base tile: a gentle top-to-bottom light gradient. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#e9edf5"/>
    </linearGradient>
    <!-- The brushstroke's multicolour sweep, tail (cool) to head (warm). -->
    <linearGradient id="stroke" x1="0.08" y1="0.7" x2="0.92" y2="0.3">
      <stop offset="0.00" stop-color="#2f7bff"/>
      <stop offset="0.32" stop-color="#3fc7a8"/>
      <stop offset="0.58" stop-color="#ffd23f"/>
      <stop offset="0.80" stop-color="#ff8a3d"/>
      <stop offset="1.00" stop-color="#ff4d6d"/>
    </linearGradient>
    <!-- Soft drop shadow to lift the stroke off the tile. -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a2235" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Rounded-square base tile. -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#tile)"/>
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96"
        fill="none" stroke="#d3d9e6" stroke-width="2"/>

  <g filter="url(#soft)">
    <!--
      The brushstroke as a closed filled ribbon. It sweeps from a thin tail at
      lower-left up to a rounded, slightly squared brush-head at right. Top edge
      and bottom edge are two C-curves; the ends are rounded caps.
        head  ~ (388,196)   tail ~ (108,322)
    -->
    <path d="M 110 300
             C 180 214, 280 190, 360 196
             C 392 198, 404 226, 396 250
             C 388 272, 356 276, 330 268
             C 280 252, 196 256, 138 332
             C 126 348, 100 340, 96 322
             C 93 312, 101 305, 110 300 Z"
          fill="url(#stroke)"/>

    <!-- Wet-sheen highlight ribbon along the upper edge. -->
    <path d="M 126 296
             C 190 224, 282 204, 352 210"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.38"
          stroke-width="12"
          stroke-linecap="round"/>
  </g>

  <!-- Paint dabs flicked off the tail (lower-left), as if the brush lifted. -->
  <g filter="url(#soft)">
    <circle cx="96"  cy="356" r="14" fill="#2f7bff"/>
    <circle cx="128" cy="378" r="9"  fill="#3fc7a8"/>
    <circle cx="74"  cy="386" r="7"  fill="#2f7bff" fill-opacity="0.85"/>
  </g>
</svg>
